{% extends "nav.html" %}

{% block content %}
<div class="container">

    <form id="edit-form" class="registration-form">
        <h2 class="form-title">Vehicle Details</h2>
        <div class="vehicle-image-container">
            <center>
                {% if vehicle.image %}
                <img src="data:image/jpeg;base64,{{ vehicle.image }}" alt="License Plate"
                    class="w-full rounded-lg shadow">
                {% else %}
                <div class="w-full h-48 bg-gray-200 rounded-lg flex items-center justify-center">
                    <p class="text-gray-500">No image available</p>
                </div>
                {% endif %}
            </center>
            <br>
        </div>


        <div class="form-grop">
            <label>License Plate</label>
            <p class="form-control">{{ vehicle.plate_number }}</p>
            <br>
        </div>

        <div class="form-grop">
            <label>Owner Name</label>
            <p class="form-control">{{ vehicle.owner_name }}</p>
            <br>
        </div>

        <div class="form-grop">
            <label>Vehicle Type</label>
            <p class="form-control">{{ vehicle.vehicle_type }}</p>
            <br>
        </div>


        <div class="form-group">
            <label>Registration Date</label>
            <p class="form-control">{{ vehicle.registration_date.strftime('%Y-%m-%d %H:%M:%S') }}</p>
        </div>
        <div class="form-group">
            <label>Status</label>
            <select name="status" class="form-control">
                <option value="active" {% if vehicle.status=='active' %}selected{% endif %}>Active</option>
                <option value="inactive" {% if vehicle.status=='inactive' %}selected{% endif %}>Inactive
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea name="notes" class="form-control">{{ vehicle.notes or 'No notes available'  }}</textarea>
        </div>

        <div class="flex space-x-2">
            <button type="submit" class="submit-btn">
                Save Changes
            </button>
            <button type="button" class="submit-btn" style="background-color: #dc3545;" onclick="toggleEditMode()"
                class="">
                Cancel
            </button>
            <button type="button" class="submit-btn" style="background-color: #58040c;" onclick="deleteVehicle('{{ vehicle._id }}')" class="btn">
                Delete
            </button>
        </div>
    </form>
</div>


<script>
    function toggleEditMode() {
        const viewMode = document.querySelector('.view-mode');
        const editForm = document.querySelector('#edit-form');
        viewMode.classList.toggle('hidden');
        editForm.classList.toggle('hidden');
    }

    async function deleteVehicle(vehicleId) {
        const result = await Swal.fire({
            title: 'Are you sure?',
            text: "This action cannot be undone",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#3085d6',
            confirmButtonText: 'Yes, delete it!'
        });
        if (result.isConfirmed) {

            try {
                const response = await fetch(`/vehicle/${vehicleId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    Swal.fire(
                        'Deleted!',
                        'Vehicle has been removed.',
                        'success'
                    ).then(() => {
                        window.location.href = '/vehicles';
                    });

                } else {
                    Swal.fire(
                        'Error',
                        'Failed to delete vehicle',
                        'error'
                    );
                }
            } catch (error) {
                console.error('Error:', error);
                Swal.fire(
                    'Error',
                    'Failed to delete vehicle',
                    'error'
                );
            }
        }
    }

    document.getElementById('edit-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = {
            status: e.target.status.value,
            notes: e.target.notes.value
        };

        try {
            const response = await fetch(window.location.pathname, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            });

            if (response.ok) {
                location.reload();
            } else {
                alert('Failed to update vehicle');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('An error occurred while updating the vehicle');
        }
    });
</script>
{% endblock %}
